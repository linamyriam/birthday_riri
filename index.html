<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Surprise Pour toiiiii🎂</title>

<style>
body {
    margin: 0;
    background: #0b1c2d;
    overflow: hidden;
    font-family: Georgia, cursive;
    color: MediumPurple;
    text-align: center;
}

#countdown {
    font-size: 28px;
    margin-top: 40vh;
}

#message {
    white-space: pre-line;
    font-size: 90px;
    width: 70%;
    margin: auto;
    margin-top: 5%;
}

.photo {
    position: absolute;
    width: 170px;
    height: 200px;
    object-fit: cover;
}
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="countdown"></div>
<div id="message"></div>

<script>
const unlockDate = new Date("2026-02-19T11:44:00").getTime();

const messageText = `🎉 JOYEUX ANNIVERSAIRE MA RIRI 🎉

I hope the waiting wasn't too long. 
18 years old already, we're growing up and it's really hard to realise.
It's crazy how it has only been 2 years since we know each other, it feels like decades !
I wanted to thank you for always being there for me, whether as a friend or even as a second mother.
In fact, you're the first person I turn to when I need a wise and thoughtful opinion on something.
So 18 y/o don't seem that strange after all, you've always been mature !!
You're an amazing person and I hope that you'll never doubt that. 
I know that you put a lot of pressure on yourself to be better than perfect, but you don't have to !!
You're worth more than diamonds. I'm so greatfull that our paths crossed, 
and I hope our friendship will never come to an end, whether as the SixReines or The HOES.
Unfortunatelly, we're getting closer to the end of the year,
but we won't let studies get in the way !! We'll try to see each other once a month ??
That doesn't soundss impossible.
We'll do escape games maybe (Thanks again to your father the gawt) or big chit chat and gossip.
Either way is fine since being together and keep building memories together is the most important!!

I think I've already yapped a lot haha, cheesy kiss, I love you riri!
Have an amazing day  ❤️`;

const images = [
    "images/img1.jpg",
    "images/img2.jpg",
    "images/img3.jpg",
    "images/img4.jpg",
    "images/img5.jpg",
    "images/img6.jpg",
    "images/img7.jpg",
    "images/img8.jpg",
    "images/img9.jpg"
];

const countdownDiv = document.getElementById("countdown");
const messageDiv = document.getElementById("message");

function updateCountdown() {
    const now = new Date().getTime();
    const distance = unlockDate - now;

    if (distance > 0) {
        const days = Math.floor(distance / (1000*60*60*24));
        const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
        const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
        const seconds = Math.floor((distance % (1000*60)) / 1000);

        countdownDiv.innerHTML =
        `⏳ You will be able to read this in :
        ${days}j ${hours}h ${minutes}m ${seconds}s ⏳`;

    } else {
        clearInterval(timer);
        countdownDiv.innerHTML = "";
        startExplosion();
    }
}

const timer = setInterval(updateCountdown, 1000);


// 🎆 Explosion (canvas)
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function startExplosion() {
    for (let i = 0; i < 120; i++) {
        particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: (Math.random() - 0.5) * 10,
            dy: (Math.random() - 0.5) * 10,
            size: Math.random() * 6 + 4
        });
    }
    animate();
    setTimeout(typeWriter, 1500);
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = ["purple","pink","cyan","plum"][Math.floor(Math.random()*4)];
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
    });
    requestAnimationFrame(animate);
}

// ✍️ Machine à écrire
function typeWriter() {
    let i = 0;
    function typing() {
        if (i < messageText.length) {
            messageDiv.innerHTML += messageText.charAt(i);
            i++;
            setTimeout(typing, 40);
        } else {
            showPhotos();
        }
    }
    typing();
}

// 📸 Photos aléatoires
function showPhotos() {
    images.forEach((src, index) => {
        setTimeout(() => {
            const img = document.createElement("img");
            img.src = src;
            img.className = "photo";
            img.style.left = Math.random() * (window.innerWidth - 200) + "px";
            img.style.top = Math.random() * (window.innerHeight - 200) + "px";
            document.body.appendChild(img);
        }, index * 700);
    });
}
</script>

</body>
</html>
